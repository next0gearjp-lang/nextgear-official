        .contact-box { background-color: var(--bg-sub); padding: 100px 40px; text-align: center; border: 1px solid #111; border-radius: 4px; transition: var(--transition); }

        .detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.98); backdrop-filter: blur(15px); z-index: 2000; display: flex; transform: translate3d(0, 100%, 0); opacity: 0; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease; overflow-y: auto; will-change: transform, opacity; }

        .sns-links { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 20px; padding-bottom: 50px; }
        .sns-links a { color: #fff; text-decoration: none; font-size: 0.7rem; border-bottom: 1px solid #333; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; transition: 0.3s; transform: translateZ(0); }
        .sns-links a:hover { opacity: 0.7; border-bottom-color: #fff; transform: translateY(-2px); }
        .spec-badge { display: inline-block; padding: 6px 16px; border: 1px solid #444; border-radius: 20px; font-size: 0.75rem; color: #bbb; background: rgba(255,255,255,0.05); }

        .close-btn:hover { color: #fff; }

        .legal-overlay {
